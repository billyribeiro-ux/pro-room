[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "server"

[lints]
workspace = true

[dependencies]
domain = { workspace = true }
authz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "catch-panic"] }
futures-util = "0.3.33"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "macros", "migrate"] }
fred = { version = "10.1.0", features = ["subscriber-client"] }
# argon2 0.6 is still pre-release (0.6.0-rc.*); stay on latest stable 0.5.x.
argon2 = "0.5.3"
sha2 = "0.11.0"
base64 = "0.22.1"
# `rust_crypto` selects the pure-Rust HMAC/SHA2 provider for HS256 token signing.
# jsonwebtoken 10's default features enable NO crypto provider, so `encode` panics
# at runtime ("could not determine CryptoProvider") unless exactly one is chosen.
# rust_crypto avoids aws_lc_rs's native cmake/clang build deps (cleaner CI builds).
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
dotenvy = "0.15.7"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2", "form"] }
# reqwest 0.13's `rustls-no-provider` bundles no crypto provider, so we install
# the pure-Rust *ring* provider as the process-wide default in `main` (see
# main.rs). This keeps the original architecture decision — no aws-lc-rs, hence
# no native cmake/clang build deps / cleaner CI — while staying on the latest
# reqwest. Root certs are handled by reqwest 0.13's built-in rustls-platform-verifier.
# rustls 0.24 is still pre-release; stay on latest 0.23.x.
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }

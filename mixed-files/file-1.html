    <script>
        function openImageModal(event, url) {
            if (event && (event.shiftKey || event.altKey || event.ctrlClick)) {
                const newWindow = window.open(
                    null,
                    null,
                    "toolbar=0,location=0,resizable=1,scrollbars=1",
                );
                newWindow.document.write(`<!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>${url}</title>
                <style>
                  html,
                  body {
                      height: 100%;
                      width: 100%;
                      overflow-x: hidden;
                      overflow-y: auto;
                      background-color: #000;
                  }

                  body {
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
                </style>
              </head>
              <body>
                <img src="${url}" alt="${url}" />
              </body>
            </html>`);

                return;
            }
            var imageName = url.substring(url.lastIndexOf("/") + 1);
            return bootbox.dialog({
                onEscape: true,
                message:
                    '<img src="' +
                    url +
                    '" alt="' +
                    imageName +
                    '" /><hr><button class="btn btn-primary btn-sm" onclick="downloadImage(\'' +
                    url +
                    "', '" +
                    imageName +
                    '\')"><i class="fa fa-download"></i> Download Image</button>',
                closeButton: true,
                size: "large",
                className: "imgur-modal",
            });
        }
        function downloadImage(url, imageName) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.responseType = "blob";
            xhr.onload = function () {
                var urlCreator = window.URL || window.webkitURL;
                var imageUrl = urlCreator.createObjectURL(this.response);
                var tag = document.createElement("a");
                tag.href = imageUrl;
                imageName = imageName.split("/").pop() || "image.jpg";
                imageName = imageName
                    .replace(/^[^_]+_/, "") // Remove first part up to first _
                    .replace(/_[^_]+(\.[^.]+)$/, "$1"); // Remove last part before extension
                console.log("imageName: ", imageName);
                tag.download = imageName;
                tag.style.display = "none";
                document.body.appendChild(tag);
                tag.click();
                document.body.removeChild(tag);
            };
            xhr.send();
        }

        function removeImageFromChat() {
            $("#added-image-to-chat").remove();
            $(".chat-box").removeClass("position-relative");
        }

        function showChatGif(id) {
            const el = $(`#${id}`);

            if (el.next().hasClass("d-none")) {
                el.text("click to hide");
                el.next().toggleClass("d-none");
            } else {
                el.text("gif muted, click to show")
                    .next()
                    .toggleClass("d-none");
            }
        }
    </script>
